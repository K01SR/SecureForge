[workspace]
resolver = "2"
members = [
    "crates/sih149-core",
    "crates/sih149-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SecureForge Contributors"]
license = "MIT"
repository = "https://github.com/secureforge/secureforge"
description = "Integrated secure data erasure and advanced forensic file recovery platform"
keywords = ["forensics", "data-sanitization", "file-recovery", "nist-800-88", "security"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Hashing & Crypto
sha2 = "0.10"
blake3 = "1"
argon2 = "0.5"

# System & I/O
nix = { version = "0.29", features = ["fs", "ioctl"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Binary parsing
nom = "7"

# Parallelism
rayon = "1"

# Lua scripting
mlua = { version = "0.9", features = ["lua54", "vendored"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
