[package]
name = "sih149-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Beautiful interactive TUI for SecureForge"

[[bin]]
name = "sforge"
path = "src/main.rs"

[dependencies]
sih149-core = { path = "../sih149-core" }
ratatui = { workspace = true }
