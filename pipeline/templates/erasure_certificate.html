<!DOCTYPE html>
<html>
<head>
    <title>Erasure Certificate</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="header" style="background-color: #1a1a2e; color: white; padding: 20px;">
        <h1>SecureForge - CERTIFICATE OF DATA SANITIZATION</h1>
        <p>Case ID: {{ case_id }}</p>
        <p>Date: {{ date }}</p>
    </div>
    <div class="section">
        <h2>Device Information</h2>
        <table>
            <tr><th>Model</th><td>{{ device_model }}</td></tr>
            <tr><th>Serial</th><td>{{ device_serial }}</td></tr>
            <tr><th>Capacity</th><td>{{ device_capacity }}</td></tr>
            <tr><th>Interface</th><td>{{ device_interface }}</td></tr>
        </table>
    </div>
